server {
    listen 8080;
    server_name _;

    client_max_body_size 100m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /favicon.ico {
        return 204;
    }

    location = /code {
        return 301 /code/;
    }

    location = /terminal {
        return 301 /terminal/;
    }

    location /code/ {
        set $code_upstream code-server:8080;
        rewrite ^/code/(.*) /$1 break;
        proxy_pass http://$code_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /terminal/ {
        set $terminal_upstream web-terminal:7681;
        proxy_pass http://$terminal_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }


    location = /docs {
        return 301 /docs/;
    }

    # Statically rendered docs/*.md and docs/guides/*.md (built with `make docs`).
    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        try_files $uri $uri/index.html =404;
    }

    # LiteLLM API and admin UI.
    # UI at /api/litellm/ui — login: LITELLM_UI_USERNAME / LITELLM_UI_PASSWORD.
    # Regex location strips the /api/litellm prefix via capture group — avoids
    # rewrite...break which silently disables proxy_redirect variable expansion.
    # LiteLLM's frontend generates /ui/... links without the root_path prefix;
    # redirect them so the browser ends up at the correct /api/litellm/ui/... path.
    location ~ ^/ui/ {
        return 301 $scheme://$http_host/api/litellm$request_uri;
    }

    location = /api/litellm {
        return 301 $scheme://$http_host/api/litellm/;
    }

    # Nginx issues this trailing-slash redirect itself (using the correct external
    # host:port from $http_host) so litellm's internal redirect never reaches the browser.
    location = /api/litellm/ui {
        return 301 $scheme://$http_host/api/litellm/ui/;
    }

    # Starlette 0.50 get_route_path() strips root_path from scope["path"], so
    # path and root_path must be consistent: nginx must forward the FULL URL
    # (not the stripped suffix). With SERVER_ROOT_PATH=/api/litellm the app
    # uses get_route_path to strip the prefix itself.
    location ~ ^/api/litellm {
        set $litellm_upstream litellm:4000;
        proxy_pass http://$litellm_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
