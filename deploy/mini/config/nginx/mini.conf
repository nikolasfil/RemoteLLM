server {
    listen 8080;
    server_name _;

    client_max_body_size 100m;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /favicon.ico {
        return 204;
    }

    # LiteLLM API proxy.
    # LiteLLM's frontend generates /ui/... links without the root_path prefix;
    # redirect them so the browser ends up at the correct /api/litellm/ui/... path.
    location ~ ^/ui/ {
        return 301 $scheme://$http_host/api/litellm$request_uri;
    }

    location = /api/litellm {
        return 301 $scheme://$http_host/api/litellm/;
    }

    location = /api/litellm/ui {
        return 301 $scheme://$http_host/api/litellm/ui/;
    }

    location ~ ^/api/litellm {
        set $litellm_upstream litellm:4000;
        proxy_pass http://$litellm_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
