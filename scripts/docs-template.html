<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$ · RemoteLLM Docs</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #181b22;
    --text: #eef1f6;
    --muted: #aab3c2;
    --accent: #59c1a5;
    --border: #2a2f3a;
    --tag-bg: #1e2330;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .layout { display: flex; align-items: flex-start; min-height: 100vh; }
  nav.sidebar {
    width: 260px;
    flex-shrink: 0;
    box-sizing: border-box;
    padding: 24px 18px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  nav.sidebar a.home-link {
    display: block;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 20px;
    font-size: 15px;
  }
  nav.sidebar .nav-section { margin-bottom: 20px; }
  nav.sidebar h3 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  nav.sidebar a {
    display: block;
    padding: 5px 0;
    color: var(--text);
    text-decoration: none;
    font-size: 13.5px;
  }
  nav.sidebar a:hover { color: var(--accent); }
  nav.sidebar a.back {
    display: block;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 4px;
  }
  main {
    flex: 1;
    min-width: 0;
    padding: 40px clamp(20px, 5vw, 64px) 80px;
  }
  .content { max-width: 780px; }
  .content h1 { font-size: 30px; margin: 0 0 8px; }
  .content h2 { font-size: 21px; margin: 36px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .content h3 { font-size: 16px; margin: 24px 0 8px; color: var(--accent); }
  .content p, .content li { line-height: 1.6; color: var(--text); }
  .content ul, .content ol { padding-left: 22px; }
  .content a { color: var(--accent); }
  .content code {
    font-family: ui-monospace, "SFMono-Regular", monospace;
    background: var(--tag-bg);
    padding: 2px 5px;
    border-radius: 4px;
    font-size: .9em;
  }
  .content pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
  }
  .content pre code { background: none; padding: 0; }
  .content table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
  .content th, .content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .content th { color: var(--muted); font-weight: 600; }
  .content blockquote {
    border-left: 3px solid var(--accent);
    margin: 16px 0;
    padding: 4px 16px;
    color: var(--muted);
  }
  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    nav.sidebar { width: auto; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
  <div class="layout">
    $sidebar$
    <main>
      <div class="content">
$body$
      </div>
    </main>
  </div>
</body>
</html>
